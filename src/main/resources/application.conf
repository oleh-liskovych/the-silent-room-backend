ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.silentroom.ApplicationKt.module ]
    }
}

jwt {
    secret = "silent-room-jwt-secret-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "the-silent-room"
    audience = "the-silent-room-users"
    realm = "The Silent Room"
    expiresIn = 86400000
}

database {
    url = "jdbc:postgresql://localhost:5432/silentroom"
    url = ${?DATABASE_URL}
    user = "silentroom"
    user = ${?DATABASE_USER}
    password = "silentroom"
    password = ${?DATABASE_PASSWORD}
    driver = "org.postgresql.Driver"
    maxPoolSize = 10
}

storage {
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}
    maxFileSize = 10485760
}
